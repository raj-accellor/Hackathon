name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: markets, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: markets }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U markets" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - name: Tests (SQLite, mock MCP servers, mocked LLM)
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Migrations apply to PostgreSQL and match the models
        env: { DATABASE_URL: "postgresql+asyncpg://markets:ci-only@localhost:5432/markets" }
        run: uv run alembic upgrade head && uv run alembic check
      - name: Dependency audit
        run: uvx pip-audit --strict --disable-pip -r <(uv export --frozen --no-dev --no-hashes) || true

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high || true

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: End-to-end (demo stack with mock MCP servers)
        run: cd frontend && npm run e2e
